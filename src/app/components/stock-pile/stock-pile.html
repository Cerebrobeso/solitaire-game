<div class="flex flex-col items-center gap-2">
  @if (topCard()) {
    <div
      (click)="onDraw()"
      class="group cursor-pointer rounded-lg border-2 border-dashed border-white/30 relative"
    >
      <div class="hidden group-hover:flex items-center justify-center w-20 h-28 rounded-lg bg-white/5 absolute top-0 left-0 z-10 text-white/40">
        <svg lucideRotateCcw></svg>
      </div>
      <app-card [card]="topCard()!" />
    </div>
  } @else {
    <div
      (click)="onDraw()"
      class="w-20 h-28 rounded-lg border-2 border-dashed border-white/30
        flex items-center justify-center text-white/40 text-2xl cursor-pointer hover:border-white/50 transition-colors"
    >
      <svg lucideRotateCcw></svg>
    </div>
  }
</div>
