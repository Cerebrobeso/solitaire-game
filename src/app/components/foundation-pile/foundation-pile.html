<div
  cdkDropList
  [id]="'foundation-' + foundation().suit"
  [cdkDropListConnectedTo]="connectedTo()"
  [cdkDropListEnterPredicate]="canEnter"
  [cdkDropListSortingDisabled]="true"
  (cdkDropListDropped)="onDrop($event)"
  class="w-20 h-28 rounded-lg border-2 border-dashed border-white/30 relative flex items-center justify-center"
>
  @if (topCard(); as card) {
    <div cdkDrag [cdkDragData]="card" class="absolute inset-0 cursor-grab active:cursor-grabbing rounded-lg">
      <app-card [card]="card" />
    </div>
  } @else {
    <div class="flex flex-col items-center text-white/30 leading-none select-none">
      <span class="text-2xl">{{ suitSymbol() }}</span>
      <span class="text-xs mt-1">A</span>
    </div>
  }
</div>
