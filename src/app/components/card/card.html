@if (card().faceUp) {
  <div
    class="relative w-20 h-28 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1.5 select-none cursor-grab active:cursor-grabbing overflow-hidden"
    [class.text-red-600]="isRed()"
    [class.text-gray-900]="!isRed()"
    [attr.aria-label]="label()"
  >
    <div class="flex flex-col items-start leading-none">
      <span class="text-sm font-bold">{{ card().rank }}</span>
      <span class="text-sm">{{ symbol() }}</span>
    </div>

    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <span class="text-3xl">{{ symbol() }}</span>
    </div>

    <div class="flex flex-col items-end leading-none rotate-180">
      <span class="text-sm font-bold">{{ card().rank }}</span>
      <span class="text-sm">{{ symbol() }}</span>
    </div>
  </div>
} @else {
  <div
    class="w-20 h-28 rounded-lg border border-gray-400 shadow-md bg-blue-800 select-none cursor-default"
    style="background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 8px)"
    aria-label="Carta coperta"
  >
    <div class="w-full h-full rounded-md border-2 border-blue-600/50"></div>
  </div>
}
